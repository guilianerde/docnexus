name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: docnexus_test
          POSTGRES_USER: docnexus
          POSTGRES_PASSWORD: docnexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docnexus -d docnexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          DOCNEXUS_TEST_DATABASE_URL: "postgres://docnexus:docnexus_test@127.0.0.1:5432/docnexus_test"
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Replay knowledge maintenance evaluation
        run: node scripts/eval-knowledge.mjs

      - name: Measure development retrieval quality
        if: matrix.node-version == 24
        run: |
          node scripts/eval-retrieval-quality.mjs > retrieval-quality-dev.json
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const report = JSON.parse(readFileSync("retrieval-quality-dev.json", "utf8")); console.log(JSON.stringify({ summary: report.summary, invariants: report.invariants }, null, 2));'

      - name: Inspect package dry run
        run: npm pack --dry-run

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Smoke test installed tarball
        if: matrix.node-version == 24
        run: node scripts/tarball-smoke.mjs
